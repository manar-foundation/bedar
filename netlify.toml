# ================================================================
# Netlify — build + serve configuration.
# Infrastructure spec §7: the site runs on the Personal plan before
# public launch. Rollback is "Publish deploy" on any earlier snapshot
# in the Deploys tab, free and instant on every plan.
# ================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ── Canonical program path ──────────────────────────────────────
# The detail path is unified on the plural /programs/:slug. The
# legacy singular /program/:slug 301s to it so crawlers see one
# canonical URL (the app also redirects client-side — see routes.jsx).
# Must come BEFORE the SPA fallback to win over it.
[[redirects]]
  from = "/program/*"
  to = "/programs/:splat"
  status = 301

# ── SPA fallback ────────────────────────────────────────────────
# React Router owns every path. Without this, a hard refresh on
# /programs asks Netlify for a file that does not exist and returns
# Netlify's own 404 instead of the app's. Must stay LAST so real
# files and any redirects added above still win.
#
# `/shell.html`, NOT `/index.html`: the build no longer emits an
# index.html. Vercel — the canonical host — serves every HTML route
# through `api/html.js` so the Search Console tag, the Organization
# JSON-LD and the dashboard's custom code are in the response a
# non-executing crawler reads, and that function is only reachable
# if no static file answers `/` first. See the Vite plugin in
# `vite.config.js`.
#
# NETLIFY IS A SECONDARY DEPLOYMENT AND IS ALREADY DEGRADED. It has
# no `api/` runtime, so `/robots.txt` and `/sitemap.xml` are
# swallowed by this very fallback and answer with the HTML shell
# (client notes §7, §8 do not work here), and nothing is injected
# server-side. This line keeps the app itself loading; it does not
# make Netlify equivalent to Vercel. Wiring that up would mean
# porting `api/` to `netlify/functions/`.
[[redirects]]
  from = "/*"
  to = "/shell.html"
  status = 200

# ── Security headers ────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Vite fingerprints every asset filename, so these are safe to cache
# permanently — a content change produces a new filename.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
