# ================================================================
# Netlify — build + serve configuration.
# Infrastructure spec §7: the site runs on the Personal plan before
# public launch. Rollback is "Publish deploy" on any earlier snapshot
# in the Deploys tab, free and instant on every plan.
# ================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ── SPA fallback ────────────────────────────────────────────────
# React Router owns every path. Without this, a hard refresh on
# /programs asks Netlify for a file that does not exist and returns
# Netlify's own 404 instead of the app's. Must stay LAST so real
# files and any redirects added above still win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers ────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Vite fingerprints every asset filename, so these are safe to cache
# permanently — a content change produces a new filename.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
