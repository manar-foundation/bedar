<!-- @dsCard group="Colors" viewport="700x220" name="Accent — Warm bronze (CTAs only)" subtitle="Single warm accent reserved for primary CTAs and highlights" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{background:var(--bg-app);overflow:hidden}body{padding:20px;font:var(--type-body-sm)}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw{aspect-ratio:1/1.1;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff;font:var(--type-caption)}
.sw.light{color:var(--brand-950)}
.sw b{font:var(--type-label);display:block}
.sw code{font-size:10px;opacity:.85}
h4{margin:0 0 12px;font:var(--type-h5)}
p{color:var(--text-secondary);margin:0 0 10px}
</style></head><body>
<h4>Accent — warm bronze</h4>
<p>Reserved for CTAs only. Never used as a general design accent.</p>
<div class="row">
  <div class="sw light" style="background:var(--accent-100)"><b>100</b><code>#F1E4D6</code></div>
  <div class="sw light" style="background:var(--accent-300)"><b>300</b><code>#CFA98A</code></div>
  <div class="sw" style="background:var(--accent-500)"><b>500</b><code>#B08968</code></div>
  <div class="sw" style="background:var(--accent-600)"><b>600</b><code>#8F6D50</code></div>
  <div class="sw" style="background:var(--accent-700)"><b>700</b><code>#6C513B</code></div>
</div>
</body></html>
