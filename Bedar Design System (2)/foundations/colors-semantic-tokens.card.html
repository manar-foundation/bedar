<!-- @dsCard group="Colors" viewport="700x180" name="Semantic Tokens (Light)" subtitle="Aliases mapped from base scales — always reference these, not raw hex" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{background:var(--bg-app);overflow:hidden}body{padding:20px;font:var(--type-body-sm)}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;font-size:12px">
  <div>
    <div style="font-weight:600;margin-bottom:6px;color:var(--text-secondary)">Backgrounds</div>
    <div style="display:flex;align-items:center;gap:8px;padding:4px 0"><span style="width:24px;height:24px;border-radius:6px;background:var(--bg-app);border:1px solid var(--border-subtle)"></span><code style="font-family:var(--font-mono);font-size:11px">--bg-app</code></div><div style="display:flex;align-items:center;gap:8px;padding:4px 0"><span style="width:24px;height:24px;border-radius:6px;background:var(--bg-surface);border:1px solid var(--border-subtle)"></span><code style="font-family:var(--font-mono);font-size:11px">--bg-surface</code></div><div style="display:flex;align-items:center;gap:8px;padding:4px 0"><span style="width:24px;height:24px;border-radius:6px;background:var(--bg-sunken);border:1px solid var(--border-subtle)"></span><code style="font-family:var(--font-mono);font-size:11px">--bg-sunken</code></div><div style="display:flex;align-items:center;gap:8px;padding:4px 0"><span style="width:24px;height:24px;border-radius:6px;background:var(--bg-inverse);border:1px solid var(--border-subtle)"></span><code style="font-family:var(--font-mono);font-size:11px">--bg-inverse</code></div>
  </div>
  <div>
    <div style="font-weight:600;margin-bottom:6px;color:var(--text-secondary)">Text</div>
    <div style="padding:2px 0;color:var(--text-primary);font-weight:500">Primary body <code style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);font-weight:400">--text-primary</code></div><div style="padding:2px 0;color:var(--text-secondary);font-weight:500">Secondary <code style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);font-weight:400">--text-secondary</code></div><div style="padding:2px 0;color:var(--text-muted);font-weight:500">Muted meta <code style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);font-weight:400">--text-muted</code></div><div style="padding:2px 0;color:var(--text-link);font-weight:500">Link <code style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);font-weight:400">--text-link</code></div>
  </div>
</div></body></html>
