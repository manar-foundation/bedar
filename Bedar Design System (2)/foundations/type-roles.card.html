<!-- @dsCard group="Type" viewport="700x180" name="Type Roles" subtitle="Caption · Label · Button · Overline" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{background:var(--bg-app);overflow:hidden}body{padding:20px;font:var(--type-body-sm)}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px">
  <div><div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">CAPTION</div><div style="font:var(--type-caption);color:var(--text-secondary)">Updated 3 hours ago</div></div>
  <div><div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">LABEL</div><div style="font:var(--type-label)">Program name</div></div>
  <div><div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">BUTTON</div><div style="font:var(--type-button);text-transform:none">Apply now</div></div>
  <div><div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">OVERLINE</div><div style="font:var(--type-overline);letter-spacing:.06em;text-transform:uppercase;color:var(--brand-600)">FEATURED</div></div>
</div></body></html>
