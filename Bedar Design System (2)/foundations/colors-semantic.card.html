<!-- @dsCard group="Colors" viewport="700x160" name="Semantic" subtitle="Success · Warning · Error · Info — each with tint + strong pair" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{background:var(--bg-app);overflow:hidden}body{padding:20px;font:var(--type-body-sm)}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;height:100%">

<div style="display:flex;flex-direction:column;gap:4px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)">
  <div style="background:var(--success-100);color:var(--success-700);padding:8px 10px;font-weight:600;font-size:12px">Success 100</div>
  <div style="background:var(--success-500);color:#fff;padding:8px 10px;font-weight:600;font-size:12px;flex:1;display:flex;align-items:flex-end">500</div>
  <div style="background:var(--success-700);color:#fff;padding:6px 10px;font-weight:600;font-size:11px">700</div>
</div>
<div style="display:flex;flex-direction:column;gap:4px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)">
  <div style="background:var(--warning-100);color:var(--warning-700);padding:8px 10px;font-weight:600;font-size:12px">Warning 100</div>
  <div style="background:var(--warning-500);color:#fff;padding:8px 10px;font-weight:600;font-size:12px;flex:1;display:flex;align-items:flex-end">500</div>
  <div style="background:var(--warning-700);color:#fff;padding:6px 10px;font-weight:600;font-size:11px">700</div>
</div>
<div style="display:flex;flex-direction:column;gap:4px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)">
  <div style="background:var(--error-100);color:var(--error-700);padding:8px 10px;font-weight:600;font-size:12px">Error 100</div>
  <div style="background:var(--error-500);color:#fff;padding:8px 10px;font-weight:600;font-size:12px;flex:1;display:flex;align-items:flex-end">500</div>
  <div style="background:var(--error-700);color:#fff;padding:6px 10px;font-weight:600;font-size:11px">700</div>
</div>
<div style="display:flex;flex-direction:column;gap:4px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)">
  <div style="background:var(--info-100);color:var(--info-700);padding:8px 10px;font-weight:600;font-size:12px">Info 100</div>
  <div style="background:var(--info-500);color:#fff;padding:8px 10px;font-weight:600;font-size:12px;flex:1;display:flex;align-items:flex-end">500</div>
  <div style="background:var(--info-700);color:#fff;padding:6px 10px;font-weight:600;font-size:11px">700</div>
</div>
</div></body></html>
