<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100vh;overflow:hidden}
.page{display:grid;grid-template-columns:1fr 96px;height:100vh}
.main{background:var(--brand-950);display:flex;align-items:center;justify-content:center;padding:120px;position:relative;overflow:hidden}
.main::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 45%,rgba(169,225,211,0.28),transparent 60%);pointer-events:none}
.main img{width:72%;max-width:820px;height:auto;position:relative;z-index:1;filter:brightness(0) invert(1)}
.strip{display:grid;grid-template-rows:1fr 1fr 1fr}
.strip>div:nth-child(1){background:var(--brand-200)}
.strip>div:nth-child(2){background:var(--brand-500)}
.strip>div:nth-child(3){background:var(--brand-800)}
</style></head><body>
<div class="page"><div class="main"><img src="assets/bedar-logo.svg" alt="Bedar"></div><div class="strip"><div></div><div></div><div></div></div></div>
</body></html>
