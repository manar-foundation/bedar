  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-neutral-600:#3D4547;\n  --neutral-700:#282F30;\n  --neutral-800:#181D1E;\n  --neutral-900:#0C1112;\n  --neutral-1000:#050809;\n\n  /* Semantic base — muted to sit inside the teal palette */\n  --success-500:#3B8F6A;\n  --success-100:#D9EDE2;\n  --success-700:#1F5A41;\n\n  --warning-500:#B87A2E;\n  --warning-100:#F6E4CB;\n  --warning-700:#6E4718;\n\n  --error-500:#B14545;\n  --error-100:#F1D6D6;\n  --error-700:#70262A;\n\n  --info-500:#3C6E86;\n  --info-100:#D6E2EA;\n  --info-700:#1E3F52;\n}\n\n/* --------- LIGHT MODE (default) --------- */\n:root, [data-theme=\"light\"]{\n  --bg-app:var(--neutral-25);\n  --bg-surface:var(--neutral-0);\n  --bg-raised:var(--neutral-0);\n  --bg-sunken:var(--neutral-50);\n  --bg-inverse:var(--brand-950);\n  --bg-overlay:rgba(2,33,36,0.60);\n\n  --text-primary:var(--brand-950);\n  --text-secondary:var(--neutral-600);\n  --text-muted:var(--neutral-500);\n  --text-disabled:var(--neutral-400);\n  --text-inverse:var(--neutral-0);\n  --text-link:var(--brand-600);\n  --text-link-hover:var(--brand-800);\n\n  --border-subtle:var(--neutral-100);\n  --border-default:var(--neutral-200);\n  --border-strong:var(--neutral-300);\n  --border-focus:var(--brand-500);\n\n  --action-primary:var(--brand-500);\n  --action-primary-hover:var(--brand-600);\n  --action-primary-active:var(--brand-700);\n  --action-primary-on:var(--neutral-0);\n\n  --action-accent:var(--accent-500);\n  --action-accent-hover:var(--accent-600);\n  --action-accent-on:var(--neutral-0);\n\n  --action-danger:var(--error-500);\n  --action-danger-hover:var(--error-700);\n\n  --field-bg:var(--neutral-0);\n  --field-bg-disabled:var(--neutral-50);\n  --field-border:var(--neutral-300);\n\n  --state-hover-tint:rgba(64,116,121,0.06);\n  --state-selected-tint:rgba(64,116,121,0.12);\n\n  --glass-bg:rgba(255,255,255,0.72);\n  --glass-border:rgba(255,255,255,0.6);\n\n  /* Hero glow (dark-section treatment) */\n  --hero-bg:var(--brand-950);\n  --hero-glow:radial-gradient(ellipse 60% 50% at 50% 0%, rgba(169,225,211,0.28), transparent 60%); /* @kind other */\n  --hero-highlight:var(--brand-200);\n}\n\n/* --------- DARK MODE --------- */\n[data-theme=\"dark\"]{\n  --bg-app:#08181A;\n  --bg-surface:#0F2325;\n  --bg-raised:#132A2D;\n  --bg-sunken:#061416;\n  --bg-inverse:var(--neutral-25);\n  --bg-overlay:rgba(0,0,0,0.66);\n\n  --text-primary:#E8F1F0;\n  --text-secondary:#A6B4B5;\n  --text-muted:#7B8A8B;\n  --text-disabled:#4F5B5C;\n  --text-inverse:var(--brand-950);\n  --text-link:var(--brand-200);\n  --text-link-hover:var(--mint-300);\n\n  --border-subtle:#1B2E31;\n  --border-default:#26393C;\n  --border-strong:#334A4D;\n  --border-focus:var(--brand-300);\n\n  --action-primary:var(--brand-300);\n  --action-primary-hover:var(--brand-200);\n  --action-primary-active:var(--mint-300);\n  --action-primary-on:#04120E;\n\n  --action-accent:var(--accent-300);\n  --action-accent-hover:var(--accent-500);\n  --action-accent-on:#1E1408;\n\n  --action-danger:#D46E6E;\n  --action-danger-hover:#E48F8F;\n\n  --field-bg:#0F2325;\n  --field-bg-disabled:#0A1B1D;\n  --field-border:#2A3D40;\n\n  --state-hover-tint:rgba(169,225,211,0.08);\n  --state-selected-tint:rgba(169,225,211,0.16);\n\n  --glass-bg:rgba(15,35,37,0.66);\n  --glass-border:rgba(255,255,255,0.06);\n\n  --hero-bg:#020F11;\n  --hero-glow:radial-gradient(ellipse 60% 50% at 50% 0%, rgba(169,225,211,0.22), transparent 60%); /* @kind other */\n  --hero-highlight:var(--brand-200);\n}\n\n/* ================================================================\n   BEDAR TYPOGRAPHY — Readex Pro only, Arabic-first.\n   Readex Pro is a variable typeface covering Arabic + Latin natively,\n   used across headings, body, UI, and numerics. Numerals: Western (0-9) only.\n   Scale is a modular 1.200 (minor third) anchored at 16px.\n   ================================================================ */\n:root{\n  /* Family — single typeface, Latin fallbacks only for missing glyphs */\n  --font-display: \"Readex Pro\", ui-sans-serif, system-u ay);\n\n  --type-body-lg: var(--fw-regular) 18px/var(--lh-relaxed) var(--font-body);\n  --type-body:    var(--fw-regular) 16px/var(--lh-normal)  var(--font-body);\n  --type-body-sm: var(--fw-regular) 14px/var(--lh-normal)  var(--font-body);\n  --type-caption: var(--fw-medium)  12px/var(--lh-normal)  var(--font-body);\n  --type-label:   var(--fw-semibold) 13px/1.2 var(--font-body);\n  --type-button:  var(--fw-semibold) 14px/1 var(--font-display);\n  --type-overline: var(--fw-semibold) 11px/1.2 var(--font-display);\n\n  /* Stat number role — large, bold, tabular Western digits */\n  --type-stat: var(--fw-bold) clamp(48px, 5vw, 72px)/1 var(--font-display);\n}\n\n/* Arabic-aware body — same font, slightly looser leading */\n:root:lang(ar), [dir=\"rtl\"]{\n  --lh-normal: 1.70; /* @kind font */\n}\n\n/* ================================================================\n   BAYDAR SPACING — strict 8px grid.\n   Baseline unit = 4px for hair-line inner spacing only; every\n   layout spacing token is a multiple of 8.\n   ================================================================ */\n:root{\n  --space-0:   0;\n  --space-1:   4px;   /* hairline / icon-to-text */\n  --space-2:   8px;   /* base unit */\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-7:  32px;\n  --space-8:  40px;\n  --space-9:  48px;\n  --space-10: 64px;\n  --space-11: 80px;\n  --space-12: 96px;\n  --space-13:120px;\n  --space-14:160px;\n\n  /* Layout maxima */\n  --container-sm:  640px;\n  --container-md:  768px;\n  --container-lg: 1024px;\n  --container-xl: 1280px;\n  --container-2xl:1440px;\n\n  /* Breakpoints (for JS/reference; usage via @media) */\n  --bp-xs: 360px; /* @kind other */\n  --bp-sm: 640px; /* @kind other */\n  --bp-md: 768px; /* @kind other */\n  --bp-lg: 1024px; /* @kind other */\n  --bp-xl: 1280px; /* @kind other */\n  --bp-2xl:1440px; /* @kind other */\n\n  /* Grid */\n  --grid-cols: 12; /* @kind other */\n  --grid-gutter: 24px; /* @kind spacing */\n  --grid-gutter-md: 16px; /* @kind spacing */\n}\n\n/* Corner radii — soft-modern; capsule for chips, xl for surfaces */\n:root{\n  --radius-0:   0px;\n  --radius-xs:  4px;\n  --radius-sm:  6px;\n  --radius-md:  10px;\n  --radius-lg:  14px;\n  --radius-xl:  20px;\n  --radius-2xl: 28px;\n  --radius-full:9999px;\n\n  /* Semantic aliases */\n  --radius-input: var(--radius-md);\n  --radius-button: var(--radius-md);\n  --radius-card: var(--radius-lg);\n  --radius-modal: var(--radius-xl);\n  --radius-pill: var(--radius-full);\n}\n\n/* Bedar elevation — cool teal-tinted shadows for the light palette,\n   deeper alpha in dark mode for hero-glow legibility. */\n:root{\n  --shadow-e1: 0 1px 2px rgba(2,33,36,0.06), 0 1px 1px rgba(2,33,36,0.04);\n  --shadow-e2: 0 2px 4px rgba(2,33,36,0.06), 0 4px 8px rgba(2,33,36,0.06);\n  --shadow-e3: 0 6px 12px rgba(2,33,36,0.08), 0 12px 24px rgba(2,33,36,0.06);\n  --shadow-e4: 0 16px 32px rgba(2,33,36,0.10), 0 32px 64px rgba(2,33,36,0.10);\n\n  --shadow-focus: 0 0 0 4px rgba(64,116,121,0.24);\n  --shadow-focus-danger: 0 0 0 4px rgba(177,69,69,0.22);\n  --shadow-inner: inset 0 1px 2px rgba(2,33,36,0.06);\n\n  /* Hero glow — pooled radial luminance behind headline */\n  --shadow-hero-glow: 0 0 120px rgba(169,225,211,0.35);\n\n  /* Blur / glass rules */\n  --blur-sm: blur(6px); /* @kind other */\n  --blur-md: blur(12px); /* @kind other */\n  --blur-lg: blur(24px); /* @kind other */\n}\n\n[data-theme=\"dark\"]{\n  --shadow-e1: 0 1px 2px rgba(0,0,0,0.4);\n  --shadow-e2: 0 2px 6px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.3);\n  --shadow-e3: 0 6px 16px rgba(0,0,0,0.5), 0 12px 24px rgba(0,0,0,0.4);\n  --shadow-e4: 0 16px 40px rgba(0,0,0,0.6);\n  --shadow-focus: 0 0 0 4px rgba(124,192,180,0.35);\n}\n\n/* Motion tokens — subtle, respectful of reduced-motion */\n:root{\n  --dur-instant: 80ms; /* @kind other */\n  --dur-fast:   140ms; /* @kind other */\n  --dur-base:   220ms; /* @kind other */\n  --dur-slow:   360ms; /* @kind other */\n  --dur-slower: 560ms; /* @kind other */\n\n  --ease-standard: cubic-bezier(0.2, 0, 0, 1); /* @kind other */\n  --ease-emphasized: cubic-bezier(0.3, 0, 0, 1.2); /* @kind other */\n  --ease-out: cubic-bezier(0, 0, 0.2, 1); /* @kind other */\n  --ease-in: cubic-bezier(0.4, 0, 1, 1); /* @kind other */\n}\n@media (prefers-reduced-motion: reduce){\n  :root{\n    --dur-fast:0ms;   /* @kind other */\n    --dur-base:0ms;   /* @kind other */\n    --dur-slow:0ms;   /* @kind other */\n    --dur-slower:0ms; /* @kind other */\n  }\n}\n\n/* Bedar base reset — imported after tokens. Readex Pro globally. */\n*,*::before,*::after{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nhtml{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-feature-settings:\"tnum\" off,\"lnum\" 1}\nbody{\n  background:var(--bg-app);\n  color:var(--text-primary);\n  font: var(--type-body);\n  font-feature-settings:\"lnum\" 1;\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n}\na{color:var(--text-link);text-decoration:none;transition:color var(--dur-fast) var(--ease-standard)}\na:hover{color:var(--text-link-hover);text-decoration:underline}\nbutton{font-family:inherit}\nimg,svg{display:block;max-width:100%}\n:focus-visible{outline:none;box-shadow:var(--shadow-focus);border-radius:var(--radius-sm)}\n::selection{background:var(--brand-200);color:var(--brand-950)}\n/* Force Western digits inside Arabic surfaces — matches Bedar identity */\n[dir=\"rtl\"], :lang(ar){font-feature-settings:\"lnum\" 1}\n\n<\u002Fstyle>\n\n<style>\nbody{padding:56px 32px;max-width:1200px;margin:0 auto}\n.hero{position:relative;background:var(--brand-950);color:#fff;padding:56px 48px;border-radius:var(--radius-2xl);margin-bottom:40px;overflow:hidden}\n.hero::before{content:\"\";position:absolute;inset:-20% -10% 10%;background:radial-gradient(ellipse 55% 55% at 50% 0%,rgba(169,225,211,0.28),transparent 60%);pointer-events:none}\n.hero>*{position:relative;z-index:1}\n.hero img{height:44px;filter:brightness(0) invert(1);margin-bottom:24px}\n.hero h1{font:var(--type-h1);margin:0 0 10px;letter-spacing:-.02em}\n.hero p{font:var(--type-body-lg);margin:0;color:rgba(255,255,255,0.72);max-width:640px;line-height:1.7}\n.hero .eyebrow{font:var(--type-overline);color:var(--brand-200);letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px;display:inline-block}\n.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:40px}\n.card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:24px;text-decoration:none;color:inherit;transition:all var(--dur-fast) var(--ease-standard);display:flex;flex-direction:column;gap:10px}\n.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-e2);text-decoration:none;border-color:var(--brand-200)}\n.card .tag{font:var(--type-overline);color:var(--brand-500);text-transform:uppercase;letter-spacing:.08em}\n.card h3{font:var(--type-h5);margin:0;color:var(--text-primary)}\n.card p{font:var(--type-body-sm);color:var(--text-secondary);margin:0;line-height:1.65}\n.card .arrow{margin-top:auto;color:var(--brand-600);font-weight:600;font-size:14px}\nh2{font:var(--type-h3);margin:40px 0 20px;display:flex;align-items:center;gap:12px}\nh2::before{content:\"\";width:6px;height:22px;background:var(--brand-500);border-radius:3px;display:inline-block}\n<\u002Fstyle><\u002Fhead>\n<body>\n<div class=\"hero\">\n  <div class=\"eyebrow\">Bedar Design System<\u002Fdiv>\n  <img src=\"96d33f7c-4694-45d6-861d-55ffec7b834c\" alt=\"Bedar\">\n  <h1>نظام تصميم بدار<\u002Fh1>\n  <p>نظام تصميم متكامل لمنصة بدار — الرموز اللونية والطباعية، المكونات، والقوالب الجاهزة للاستخدام في المشاريع الاستهلاكية.<\u002Fp>\n<\u002Fdiv>\n\n<h2>القوالب والواجهات<\u002Fh2>\n<div class=\"grid\">\n  <a class=\"card\" href=\"ui_kits/marketing/index.html\"><span class=\"tag\">Marketing · RTL<\u002Fspan><h3>الصفحة الرئيسية<\u002Fh3><p>هيرو داكن مع توهج، إحصاءات الأثر، الخدمات، البرامج، آراء الخبراء، والأسئلة الشائعة.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"ui_kits/admin/index.html\"><span class=\"tag\">Admin · Page Builder<\u002Fspan><h3>لوحة تحكم الإدارة<\u002Fh3><p>محرر صفحات ثلاثي الأعمدة مع معاينة حية وحقول مخطط JSON.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"ui_kits/admin/applicants.html\"><span class=\"tag\">Admin · Table<\u002Fspan><h3>المتقدمون<\u002Fh3><p>جدول قابل للفلترة مع علامات وحالات وإجراءات جماعية.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n\n<h2>الأسس<\u002Fh2>\n<div class=\"grid\">\n  <a class=\"card\" href=\"foundations/colors-brand.card.html\"><span class=\"tag\">Colors<\u002Fspan><h3>الألوان — Teal<\u002Fh3><p>سلم الألوان الأساسي من 25 إلى 950، مع #407479 كلون أساسي و#022124 كلون داكن عميق.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"foundations/colors-accent.card.html\"><span class=\"tag\">Colors<\u002Fspan><h3>الأكسنت الدافئ<\u002Fh3><p>لون واحد دافئ (Bronze) مخصّص للأزرار الرئيسية فقط.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"foundations/colors-dark.card.html\"><span class=\"tag\">Colors<\u002Fspan><h3>الأسطح الداكنة<\u002Fh3><p>معالجة الهيرو: خلفية brand-950 مع توهج أخضر نعناعي — تُستخدم بحرص.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"foundations/colors-neutrals.card.html\"><span class=\"tag\">Colors<\u002Fspan><h3>المحايدة<\u002Fh3><p>سلم رمادي مع ميلان طفيف نحو التيل ليتناغم مع الهوية.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"foundations/colors-semantic.card.html\"><span class=\"tag\">Colors<\u002Fspan><h3>الدلالية<\u002Fh3><p>نجاح · تحذير · خطأ · معلومات.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"foundations/type-display.card.html\"><span class=\"tag\">Type<\u002Fspan><h3>Readex Pro<\u002Fh3><p>الخط الوحيد في النظام — يغطي العربية واللاتينية معاً.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"foundations/type-scale.card.html\"><span class=\"tag\">Type<\u002Fspan><h3>سلم الأحجام<\u002Fh3><p>Modular 1.200 من 11 إلى 76 بكسل.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"foundations/type-mono.card.html\"><span class=\"tag\">Type<\u002Fspan><h3>الأرقام الغربية<\u002Fh3><p>أرقام Western (0-9) فقط، حتى داخل النصوص العربية.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"foundations/spacing-scale.card.html\"><span class=\"tag\">Spacing<\u002Fspan><h3>شبكة 8 بكسل<\u002Fh3><p>سلم المسافات الكامل.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"foundations/shadows.card.html\"><span class=\"tag\">Elevation<\u002Fspan><h3>الظلال<\u002Fh3><p>أربعة مستويات ارتفاع بظلال متمازجة مع التيل الداكن.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"foundations/brand-logo.card.html\"><span class=\"tag\">Brand<\u002Fspan><h3>الشعار<\u002Fh3><p>شعار بدار على خلفية داكنة متوهجة وخلفية فاتحة.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"foundations/brand-voice.card.html\"><span class=\"tag\">Brand<\u002Fspan><h3>الصوت واللهجة<\u002Fh3><p>دافئ، جدير بالثقة، بضمير الجمع، بلا مبالغات.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n\n<h2>المكونات<\u002Fh2>\n<div class=\"grid\">\n  <a class=\"card\" href=\"components/core/buttons.card.html\"><span class=\"tag\">Core<\u002Fspan><h3>Buttons<\u002Fh3><p>خمس صيغ، ثلاثة أحجام، جميع الحالات.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"components/core/badges.card.html\"><span class=\"tag\">Core<\u002Fspan><h3>Badges &amp; Tags<\u002Fh3><p>شارات دلالية ووسوم قابلة للإزالة.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"components/forms/forms.card.html\"><span class=\"tag\">Forms<\u002Fspan><h3>عناصر النموذج<\u002Fh3><p>Input · Select · Checkbox · Radio · Switch.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"components/forms/upload.card.html\"><span class=\"tag\">Forms<\u002Fspan><h3>رفع الملفات<\u002Fh3><p>سحب وإفلات مع معاينة.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"components/surfaces/cards.card.html\"><span class=\"tag\">Surfaces<\u002Fspan><h3>البطاقات<\u002Fh3><p>مستويات ارتفاع 1 إلى 4.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"components/surfaces/modal.card.html\"><span class=\"tag\">Surfaces<\u002Fspan><h3>Modal<\u002Fh3><p>حوار مع خلفية ضبابية.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"components/navigation/navbar.card.html\"><span class=\"tag\">Navigation<\u002Fspan><h3>Navbar<\u002Fh3><p>شريط علوي تسويقي.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"components/navigation/sidebar.card.html\"><span class=\"tag\">Navigation<\u002Fspan><h3>Sidebar<\u002Fh3><p>شريط جانبي للإدارة.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"components/data/table.card.html\"><span class=\"tag\">Data<\u002Fspan><h3>Table<\u002Fh3><p>جدول بيانات مرن.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n\n<h2>الوثائق<\u002Fh2>\n<div class=\"grid\">\n  <a class=\"card\" href=\"readme.md\"><span class=\"tag\">Docs<\u002Fspan><h3>readme.md<\u002Fh3><p>الدليل الكامل، الأسس، والتفاصيل التقنية.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"design-tokens.json\"><span class=\"tag\">Tokens<\u002Fspan><h3>design-tokens.json<\u002Fh3><p>تصدير قابل للقراءة الآلية لكل الرموز.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n  <a class=\"card\" href=\"styles.css\"><span class=\"tag\">CSS<\u002Fspan><h3>styles.css<\u002Fh3><p>نقطة الدخول الوحيدة للنظام.<\u002Fp><span class=\"arrow\">افتح ←<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
