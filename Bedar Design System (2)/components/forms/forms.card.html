<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>html,body{background:var(--bg-app);overflow:hidden}body{padding:20px;margin:0}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Badge, Tag, Input, Textarea, Select, Checkbox, Radio, Switch, FileUpload, Card, Modal, Tooltip, Table, Tabs, Breadcrumbs, Navbar, Sidebar, Hero, FeatureGrid, Testimonial, ContentCard } = window.BaydarDesignSystem_b7d248;
function App(){
  const [v,setV]=React.useState('');
  const [chk,setChk]=React.useState(true);
  const [rad,setRad]=React.useState('a');
  const [sw,setSw]=React.useState(false);
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <Input label="Full name" placeholder="Ada Lovelace" value={v} onChange={e=>setV(e.target.value)} />
      <Input label="Email" type="email" placeholder="you@bedar.org" hint="We'll never share it."/>
      <Input label="Password" type="password" error="Must be 8+ characters"/>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <Select label="Program" options={['Hackathon','Community Solutions','Second Program']} placeholder="Select…" defaultValue=""/>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        <Checkbox checked={chk} onChange={e=>setChk(e.target.checked)} label="Send me updates" description="Monthly digest of new programs."/>
        <Radio checked={rad==='a'} onChange={()=>setRad('a')} name="r" label="Individual applicant"/>
        <Radio checked={rad==='b'} onChange={()=>setRad('b')} name="r" label="Team applicant"/>
        <Switch checked={sw} onChange={e=>setSw(e.target.checked)} label="Enable notifications"/>
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
