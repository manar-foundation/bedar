function useReveal(){
  React.useEffect(()=>{
    const io = new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:0.12});
    document.querySelectorAll('[data-reveal]').forEach(el=>io.observe(el));
    return ()=>io.disconnect();
  },[]);
}

function CountUp({to,duration=1400,suffix=''}){
  const [n,setN] = React.useState(0);
  const ref = React.useRef(null);
  React.useEffect(()=>{
    let raf, start=null;
    const io = new IntersectionObserver(es=>es.forEach(e=>{
      if(e.isIntersecting){
        const step = t=>{ if(!start) start=t; const p=Math.min((t-start)/duration,1); const eased=1-Math.pow(1-p,3); setN(Math.round(eased*to)); if(p<1) raf=requestAnimationFrame(step); };
        raf = requestAnimationFrame(step);
        io.unobserve(e.target);
      }
    }),{threshold:0.4});
    if(ref.current) io.observe(ref.current);
    return ()=>{ io.disconnect(); if(raf) cancelAnimationFrame(raf); };
  },[to,duration]);
  return <span ref={ref}>{n.toLocaleString('en-US')}{suffix}</span>;
}
